<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orca Control Room</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Director console</p>
        <div class="title-row">
          <h1>Orca Control Room</h1>
          <span id="app-version" class="app-version">Checking backend…</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="connection" class="connection">Connecting…</span>
        <button id="manage" type="button">Manage lanes</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <main>
      <div id="empty" class="empty" hidden>
        <h2>Build your leadership roster</h2>
        <p>Pin the long-lived agent terminals that should always remain in view.</p>
        <button id="empty-manage" type="button">Choose agent lanes</button>
      </div>
      <section id="grid" class="lane-grid" aria-label="Agent lanes"></section>
    </main>

    <dialog id="manager-dialog" class="dialog manager-dialog">
      <form method="dialog" class="dialog-shell">
        <header>
          <div>
            <p class="eyebrow">Persistent organization</p>
            <h2>Manage agent lanes</h2>
          </div>
          <button value="cancel" class="icon-button" aria-label="Close">×</button>
        </header>
        <label class="columns-control">
          Columns
          <input id="columns" type="number" min="1" max="8" />
        </label>
        <div class="manager-columns">
          <section>
            <h3>Pinned lanes</h3>
            <div id="pinned-list" class="terminal-list"></div>
          </section>
          <section>
            <h3>Available terminals</h3>
            <input id="terminal-filter" type="search" placeholder="Filter workspaces…" />
            <div id="available-list" class="terminal-list"></div>
          </section>
        </div>
        <footer>
          <span id="save-status"></span>
          <button value="cancel">Cancel</button>
          <button id="save-config" type="button" class="primary">Save layout</button>
        </footer>
      </form>
    </dialog>

    <dialog id="transcript-dialog" class="dialog transcript-dialog">
      <div class="dialog-shell">
        <header>
          <div>
            <p class="eyebrow">Retained context</p>
            <h2 id="transcript-title">Transcript</h2>
          </div>
          <button id="close-transcript" class="icon-button" aria-label="Close">×</button>
        </header>
        <pre id="transcript-content">Loading…</pre>
      </div>
    </dialog>

    <template id="lane-template">
      <article class="lane">
        <header class="lane-header">
          <div class="lane-identity">
            <span class="status-dot"></span>
            <div>
              <h2 class="lane-name"></h2>
              <p class="lane-role"></p>
            </div>
          </div>
          <div class="lane-actions">
            <span class="children" hidden></span>
            <span class="unread" hidden>Unread</span>
            <button class="transcript" type="button">History</button>
            <button class="open-native" type="button">Open</button>
            <button class="maximize" type="button" aria-label="Maximize lane">↗</button>
          </div>
        </header>
        <div class="lane-meta"></div>
        <div class="screen-shell">
          <pre class="screen" aria-label="Mirrored terminal screen"></pre>
          <button class="jump-latest" type="button" hidden>New output ↓</button>
        </div>
        <form class="composer">
          <div class="attachment-list" hidden></div>
          <textarea
            rows="1"
            maxlength="32000"
            placeholder="Send a message…"
            aria-label="Message"
          ></textarea>
          <input
            class="attachment-input"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
            multiple
            hidden
          />
          <button
            class="terminal-mode"
            type="button"
            aria-pressed="false"
            title="Send typing and navigation keys directly to this terminal"
          >Keys</button>
          <button class="attach-image" type="button" title="Paste an image or choose a file">Image</button>
          <span class="send-status" aria-live="polite"></span>
          <button type="submit">Send</button>
        </form>
        <button
          class="lane-resize-handle"
          type="button"
          aria-label="Resize lane"
          title="Drag to resize · Arrow keys resize · Double-click resets"
        ></button>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
